<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>落地代理管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; overflow-x: hidden; background: #0f172a; color: #e2e8f0; min-height: 100vh }

        @keyframes containerAppear { 0% { opacity: 0; transform: translateY(30px) scale(0.9) } 100% { opacity: 1; transform: translateY(0) scale(1) } }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes gradientShift { 0% { background-position: 0 50% } 50% { background-position: 100% 50% } 100% { background-position: 0 50% } }
        @keyframes spin { to { transform: rotate(360deg) } }

        .page-wrapper { max-width: 800px; margin: 0 auto; padding: 20px; animation: containerAppear 0.6s ease-out }

        .page-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1) }
        .page-header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #faab41 0, #f6821f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; transition: all 0.3s }
        .back-link:hover { color: #faab41; border-color: #faab41 }

        /* Toggle */
        .toggle-section { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 24px }
        .toggle-label { font-size: 14px; font-weight: 500 }
        .toggle-switch { position: relative; width: 48px; height: 26px; flex-shrink: 0 }
        .toggle-switch input { opacity: 0; width: 0; height: 0 }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #475569; border-radius: 26px; transition: 0.3s }
        .toggle-slider:before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s }
        .toggle-switch input:checked + .toggle-slider { background: linear-gradient(135deg, #faab41, #f6821f) }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(22px) }

        /* Node list */
        .node-list { margin-bottom: 24px }
        .node-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 10px; transition: all 0.3s }
        .node-item.active { border-color: #faab41; background: rgba(250,171,65,0.08) }
        .node-item:hover { background: rgba(255,255,255,0.08) }
        .node-info { flex: 1; min-width: 0 }
        .node-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .node-url { font-size: 12px; color: #94a3b8; font-family: 'Courier New', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .node-actions { display: flex; gap: 6px; flex-shrink: 0 }
        .btn-sm { padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.2s }
        .btn-verify { background: rgba(59,130,246,0.2); color: #60a5fa }
        .btn-verify:hover { background: rgba(59,130,246,0.3) }
        .btn-select { background: rgba(16,185,129,0.2); color: #34d399 }
        .btn-select:hover { background: rgba(16,185,129,0.3) }
        .btn-select.active-btn { background: #faab41; color: #000 }
        .btn-edit { background: rgba(168,85,247,0.2); color: #c084fc }
        .btn-edit:hover { background: rgba(168,85,247,0.3) }
        .btn-delete { background: rgba(239,68,68,0.2); color: #f87171 }
        .btn-delete:hover { background: rgba(239,68,68,0.3) }

        /* Add form */
        .add-form { padding: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px }
        .add-form h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #faab41 }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap }
        .form-group { flex: 1; min-width: 0 }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px }
        .form-group input, .form-group select{ width: 100%; padding: 10px 12px; background:#1e293b; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none; transition: border-color 0.3s }
.form-group select option{background:#1e293b;color:#e2e8f0}
        .form-group input:focus, .form-group select:focus { border-color: #faab41 }
        .form-group input::placeholder { color: #64748b }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; letter-spacing: 0.5px }
        .btn-primary { background: linear-gradient(135deg, #faab41 0, #f6821f 100%); color: #fff; box-shadow: 0 4px 15px rgba(250,171,65,0.3) }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(250,171,65,0.4) }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #e2e8f0 }
        .btn-secondary:hover { background: rgba(255,255,255,0.15) }

        .status-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none }
        .status-msg.success { display: block; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3) }
        .status-msg.error { display: block; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3) }
        .status-msg.info { display: block; background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3) }

        .empty-state { text-align: center; padding: 40px 20px; color: #64748b }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4 }

        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 9999; transform: translateX(120%); transition: transform 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3) }
        .toast.show { transform: translateX(0) }
        .toast.success { background: linear-gradient(135deg, #10b981, #059669); color: #fff }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff }
        .toast.info { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff }

        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle }

        .footer-hint { text-align: center; margin-top: 40px; padding: 20px; font-size: 13px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05) }
        .footer-hint a { color: #94a3b8; text-decoration: none }
        .footer-hint a:hover { color: #faab41 }

        @media(max-width: 640px) {
            .page-wrapper { padding: 12px }
            .page-header { flex-direction: column; gap: 12px; align-items: flex-start }
            .form-row { flex-direction: column }
            .node-item { flex-direction: column; align-items: flex-start }
            .node-actions { width: 100%; justify-content: flex-end }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div class="page-header">
            <h1>落地代理管理</h1>
            <a class="back-link" href="/admin">返回管理面板</a>
        </div>

        <!-- Toggle -->
        <div class="toggle-section">
            <label class="toggle-switch">
                <input type="checkbox" id="enableToggle" onchange="toggleEnable()">
                <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">启用落地代理（订阅自动使用当前选中节点）</span>
        </div>

        <div class="form-group" style="margin-top:16px">
            <label style="display:block;margin-bottom:8px;font-size:14px;color:#94a3b8">黑名单域名<span style="color:#64748b;font-size:12px">（逗号分隔，支持通配符*）</span></label>
            <div style="display:flex;gap:8px;align-items:center">
                <input type="text" id="blacklist" placeholder="*.baidu.com.*,chatgpt.com,github.com" style="flex:1">
                <button class="btn btn-secondary" type="button" id="btnBlacklist" onclick="updateBlacklist()">更新</button>
            </div>
            <div style="margin-top:6px;font-size:12px;color:#475569">配置后，访问这些域名的请求将跳过落地代理，通过反向代理直连目标服务器</div>
        </div>

        <!-- Node list -->
        <div class="node-list" id="nodeList">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div>暂无落地代理节点</div>
                <div style="font-size: 13px; margin-top: 4px">点击下方表单添加</div>
            </div>
        </div>

        <!-- Add form -->
        <div class="add-form">
            <h3>添加落地代理节点</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 0 0 140px">
                    <label>协议</label>
                    <select id="protocol" onchange="onProtocolChange()">
                        <option value="socks5">socks5</option>
                        <option value="http">http</option>
                        <option value="https">https</option>
                        <option value="turn">turn</option>
                        <option value="sstp">sstp</option>
                        <option value="vless">vless</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2">
                    <label>地址 (user:pass@host:port 或 host:port)</label>
                    <input type="text" id="proxyAddr" placeholder="user:password@127.0.0.1:1080" oninput="onAddrInput()">
                </div>
            </div>
            <!-- VLESS 专属字段 -->
            <div id="vlessFields" style="display:none">
                <div class="form-row">
                    <div class="form-group">
                        <label>UUID</label>
                        <input type="text" id="vlessUuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:2">
                        <label>WebSocket 路径</label>
                        <input type="text" id="vlessPath" placeholder="/vless-ws-path">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>SNI</label>
                        <input type="text" id="vlessSni" placeholder="域名（留空使用地址中的host）">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>安全</label>
                        <select id="vlessSecurity">
                            <option value="none">none</option>
                            <option value="tls">tls</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>传输协议 (network)</label>
                        <select id="vlessTransportType">
                            <option value="ws">ws</option>
                            <option value="tcp">tcp</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>节点名称</label>
                    <input type="text" id="nodeName" placeholder="自定义名称（留空自动生成）">
                </div>
            </div>
            <div class="form-row" style="align-items: end">
                <div style="display: flex; gap: 8px; flex-wrap: wrap">
                    <button class="btn btn-secondary" type="button" id="btnVerify" onclick="verifyNode()" disabled>可用性验证</button>
                    <button class="btn btn-primary" type="button" id="btnAdd" onclick="addNode()">添加节点</button>
                </div>
            </div>
            <div id="formStatus" class="status-msg"></div>
        </div>

        <div class="footer-hint">
            由 <a href="https://github.com/cmliu/edgetunnel" target="_blank" rel="noopener">edgetunnel</a> 强力驱动
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let config = { 启用: false, 配置列表: [], 当前选中: "", 黑名单: "" };
        let verifiedProtocol = '', verifiedAddress = '';

        // Toast
        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Status
        function showStatus(msg, type = 'info') {
            const el = document.getElementById('formStatus');
            el.textContent = msg;
            el.className = 'status-msg ' + type;
        }

        // Load config
        async function loadConfig() {
            try {
                const res = await fetch('/admin/landing.json', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    config.启用 = data.启用 !== undefined ? data.启用 : false;
                    config.配置列表 = Array.isArray(data.配置列表) ? data.配置列表 : [];
                    config.当前选中 = data.当前选中 || "";
                    config.黑名单 = data.黑名单 || "";
                    // Ensure all nodes have Selected field (backward compatibility)
                    config.配置列表.forEach(node => {
                        if (node.Selected === undefined) {
                            node.Selected = (config.当前选中 === node.URL);
                        }
                    });
                }
            } catch (e) { console.error('加载配置失败:', e); }
            document.getElementById('blacklist').value = config.黑名单;
            document.getElementById('enableToggle').checked = config.启用;
            renderNodes();
        }

        // Toggle enable
        async function toggleEnable() {
            const 是否启用 = document.getElementById('enableToggle').checked;
            if (是否启用 && config.配置列表.length === 0) {
                showToast('请先添加落地代理节点', 'error');
                document.getElementById('enableToggle').checked = false;
                return;
            }
            config.启用 = 是否启用;
            await saveConfig();
            showToast(config.启用 ? '落地代理已启用' : '落地代理已停用', config.启用 ? 'success' : 'info');
        }

        // Render nodes
        function renderNodes() {
            const list = document.getElementById('nodeList');
            const empty = document.getElementById('emptyState');

            // Clear existing node items
            list.querySelectorAll('.node-item').forEach(el => el.remove());

            if (!config.配置列表 || config.配置列表.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            config.配置列表.forEach((node, idx) => {
                // Sync Selected field with 当前选中 (backward compatibility)
                node.Selected = (config.当前选中 === node.URL);
                const div = document.createElement('div');
                div.className = 'node-item' + (node.Selected ? ' active' : '');
                const isCurrentSelected = node.Selected;
                const maskedUrl = maskUrl(node.URL);
                div.innerHTML = `
                    <div class="node-info">
                        <div class="node-name">${isCurrentSelected ? '⭐ ' : ''}${escHtml(node.名称 || '未命名')}</div>
                        <div class="node-url">${escHtml(maskedUrl)}</div>
                    </div>
                    <div class="node-actions">
                        <button class="btn-sm btn-verify" onclick="verifyExisting(${idx})" title="验证">验证</button>
                        ${!isCurrentSelected ? '<button class="btn-sm btn-select" onclick="selectNode(' + idx + ')" title="选中">选中</button>' : '<button class="btn-sm btn-select active-btn" title="已选中">已选中</button>'}
                        <button class="btn-sm btn-edit" onclick="editNode(${idx})" title="编辑">编辑</button>
                        <button class="btn-sm btn-delete" onclick="deleteNode(${idx})" title="删除">删除</button>
                    </div>
                `;
                list.insertBefore(div, list.querySelector('.add-form'));
            });
        }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function maskUrl(url) {
            // VLESS: hide UUID in vless://UUID@host:port?...
            const vm = url.match(/^vless:\/\/([^@]+)@(.+)$/i);
            if (vm) return 'vless://****@' + vm[2];
            const i = url.indexOf('@');
            return i > 0 ? url.substring(0, url.indexOf(':', i > 0 ? url.indexOf(':') : 0)) + ':***@' + url.substring(i + 1) : url;
        }

        // Protocol change - show/hide VLESS fields
        function onProtocolChange() {
            const proto = document.getElementById('protocol').value;
            const vlessFields = document.getElementById('vlessFields');
            const addrInput = document.getElementById('proxyAddr');
            const addrLabel = addrInput.previousElementSibling;
            if (proto === 'vless') {
                vlessFields.style.display = 'block';
                addrLabel.textContent = '地址 (host:port)';
                addrInput.placeholder = 'example.com:443';
            } else {
                vlessFields.style.display = 'none';
                addrLabel.textContent = '地址 (user:pass@host:port 或 host:port)';
                addrInput.placeholder = 'user:password@127.0.0.1:1080';
            }
        }

        // Address input
        function onAddrInput() {
            const val = document.getElementById('proxyAddr').value.trim();
            document.getElementById('btnVerify').disabled = !val;
        }

        // Verify new node
        async function verifyNode() {
            const protocol = document.getElementById('protocol').value;
            const addr = document.getElementById('proxyAddr').value.trim();
            if (!addr) { showStatus('请输入代理地址', 'error'); return; }
            if (protocol === 'vless') {
                const uuid = document.getElementById('vlessUuid').value.trim();
                const wsPath = document.getElementById('vlessPath').value.trim() || '/';
                const sni = document.getElementById('vlessSni').value.trim() || '';
                if (!uuid) { showStatus('请输入 UUID', 'error'); return; }
                showStatus('验证中...', 'info');
                document.getElementById('btnVerify').disabled = true;
                try {
                    const params = new URLSearchParams();
                    params.append('vless', addr);
                    params.append('vless_uuid', uuid);
                    if (wsPath) params.append('vless_path', wsPath);
                    if (sni) params.append('vless_sni', sni);
                    params.append('vless_security', document.getElementById('vlessSecurity').value);
                    params.append('vless_transport_type', document.getElementById('vlessTransportType').value);
                    const controller = new AbortController();
                    const tid = setTimeout(() => controller.abort(), 15000);
                    const res = await fetch(`/admin/check?${params}&_t=${Date.now()}`, { signal: controller.signal });
                    clearTimeout(tid);
                    const data = await res.json();
                    if (!data.hasOwnProperty('success')) { showStatus('后端版本过旧，请升级 edgetunnel', 'error'); return; }
                    if (data.success === false) { showStatus('代理无效: ' + (data.error || '未知错误'), 'error'); return; }
                    verifiedProtocol = protocol;
                    verifiedAddress = addr;
                    showStatus('验证通过! IP: ' + (data.ip || '未知') + ' | 位置: ' + (data.loc || '未知') + ' | 延迟: ' + (data.responseTime || 0) + 'ms', 'success');
                } catch (e) {
                    showStatus('验证失败: ' + e.message, 'error');
                } finally {
                    document.getElementById('btnVerify').disabled = !document.getElementById('proxyAddr').value.trim();
                }
                return;
            }
            showStatus('验证中...', 'info');
            document.getElementById('btnVerify').disabled = true;

            try {
                const params = new URLSearchParams();
                params.append(protocol, addr);
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 15000);
                const res = await fetch(`/admin/check?${params}&_t=${Date.now()}`, { signal: controller.signal });
                clearTimeout(tid);
                const data = await res.json();
                if (!data.hasOwnProperty('success')) { showStatus('后端版本过旧，请升级 edgetunnel', 'error'); return; }
                if (data.success === false) { showStatus('代理无效: ' + (data.error || '未知错误'), 'error'); return; }
                verifiedProtocol = protocol;
                verifiedAddress = addr;
                showStatus('验证通过! IP: ' + (data.ip || '未知') + ' | 位置: ' + (data.loc || '未知') + ' | 延迟: ' + (data.responseTime || 0) + 'ms', 'success');
            } catch (e) {
                showStatus('验证失败: ' + e.message, 'error');
            } finally {
                document.getElementById('btnVerify').disabled = !document.getElementById('proxyAddr').value.trim();
            }
        }

        // Verify existing node
        async function verifyExisting(idx) {
            const node = config.配置列表[idx];
            if (!node) return;
            const parts = parseLandingUrl(node.URL);
            if (!parts) { showToast('地址格式无效', 'error'); return; }

            showToast('正在验证 ' + (node.名称 || '节点') + '...', 'info');

            try {
                const params = new URLSearchParams();
                params.append(parts.protocol, parts.address);
                if (parts.protocol === 'vless') {
                    params.append('vless_uuid', parts.uuid);
                    params.append('vless_path', parts.path);
                    if (parts.sni) params.append('vless_sni', parts.sni);
                    params.append('vless_security', parts.security || 'tls');
                    params.append('vless_transport_type', parts.transportType || 'ws');
                }
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 15000);
                const res = await fetch(`/admin/check?${params}&_t=${Date.now()}`, { signal: controller.signal });
                clearTimeout(tid);
                const data = await res.json();
                if (data.success) {
                    showToast(node.名称 + ' - IP: ' + (data.ip || '未知') + ' | 位置: ' + (data.loc || '未知'), 'success');
                } else {
                    showToast(node.名称 + ' 无效: ' + (data.error || '未知'), 'error');
                }
            } catch (e) {
                showToast('验证失败: ' + e.message, 'error');
            }
        }

        function parseLandingUrl(url) {
            // VLESS: vless://UUID@host:port?security=tls&type=ws&path=/path&sni=xxx#name
            const vm = url.match(/^vless:\/\/([^@]+)@([^:/?#]+)(?::(\d+))?(\/[^?#]*)?(?:\?([^#]*))?(?:#(.*))?$/i);
            if (vm) {
                const params = {};
                if (vm[5]) {
                    vm[5].split('&').forEach(kv => { const [k, v] = kv.split('='); params[k] = decodeURIComponent(v || ''); });
                }
                return {
                    protocol: 'vless',
                    address: vm[2] + ':' + (vm[3] || '443'),
                    uuid: vm[1],
                    host: vm[2],
                    port: vm[3] || '443',
                    path: vm[4] || params.path || '/',
                    sni: params.sni || vm[2],
                    fp: params.fp || 'chrome',
                    security: params.security || 'tls',
                    transportType: params.type || 'ws'
                };
            }
            const m = url.match(/^(socks5|http|https|turn|sstp):\/\/(.+)$/i);
            if (!m) return null;
            return { protocol: m[1].toLowerCase(), address: m[2] };
        }

        // Add node
        function addNode() {
            const protocol = document.getElementById('protocol').value;
            const addr = document.getElementById('proxyAddr').value.trim();
            const name = document.getElementById('nodeName').value.trim();

            if (!addr) { showStatus('请输入代理地址', 'error'); return; }

            let fullUrl;
            if (protocol === 'vless') {
                const uuid = document.getElementById('vlessUuid').value.trim();
                const wsPath = document.getElementById('vlessPath').value.trim() || '/';
                const sni = document.getElementById('vlessSni').value.trim() || '';
                const security = document.getElementById('vlessSecurity').value;
                const transportType = document.getElementById('vlessTransportType').value;
                if (!uuid) { showStatus('请输入 UUID', 'error'); return; }
                const parts = addr.split(':');
                const host = parts[0];
                const port = parts[1] || '443';
                fullUrl = 'vless://' + uuid + '@' + host + ':' + port
                    + '?security=' + security + '&type=' + transportType
                    + (transportType === 'ws' ? '&path=' + encodeURIComponent(wsPath) : '&headerType=none')
                    + (sni ? '&sni=' + encodeURIComponent(sni) : '')
                    + (transportType === 'ws' ? '&fp=chrome' : '');
            } else {
                fullUrl = protocol + '://' + addr;
            }

            // Check duplicate
            if (config.配置列表.some(n => n.URL === fullUrl)) {
                showStatus('该节点已存在', 'error');
                return;
            }

            const node = { 名称: name || buildName(addr, protocol), URL: fullUrl, Selected: false };
            config.配置列表.push(node);

            // Auto-select if first node, but never change enable state
            if (config.配置列表.length === 1) {
                config.当前选中 = fullUrl;
                node.Selected = true;
            }

            saveConfig().then(() => {
                renderNodes();
                showStatus('已添加: ' + node.名称, 'success');
                document.getElementById('proxyAddr').value = '';
                document.getElementById('nodeName').value = '';
                document.getElementById('vlessUuid').value = '';
                document.getElementById('vlessPath').value = '';
                document.getElementById('vlessSni').value = '';
                verifiedProtocol = '';
                verifiedAddress = '';
                showToast('节点已添加', 'success');
            });
        }

        function buildName(addr, protocol) {
            if (protocol === 'vless') {
                const host = addr.split(':')[0];
                return ('VLESS ' + host).substring(0, 20);
            }
            const p = parseLandingUrl(protocol + '://' + addr);
            const host = p ? p.address.split('@').pop().split(':')[0] : addr;
            return (protocol.toUpperCase() + ' ' + host).substring(0, 20);
        }

        // Select node
        async function selectNode(idx) {
            config.配置列表.forEach(n => n.Selected = false);
            config.当前选中 = config.配置列表[idx].URL;
            config.配置列表[idx].Selected = true;
            await saveConfig();
            renderNodes();
            showToast('已选中: ' + config.配置列表[idx].名称, 'success');
        }

        // Edit node
        function editNode(idx) {
            const node = config.配置列表[idx];
            if (!node) return;

            // Parse protocol and address from URL
            const parts = parseLandingUrl(node.URL);
            if (!parts) { showToast('节点地址格式无效', 'error'); return; }

            // Fill the add form with existing data
            document.getElementById('protocol').value = parts.protocol;
            document.getElementById('proxyAddr').value = parts.address;
            document.getElementById('nodeName').value = node.名称;
            document.getElementById('btnVerify').disabled = false;

            // Handle VLESS fields
            if (parts.protocol === 'vless') {
                document.getElementById('vlessUuid').value = parts.uuid || '';
                document.getElementById('vlessPath').value = parts.path || '/';
                document.getElementById('vlessSni').value = parts.sni || '';
                document.getElementById('vlessSecurity').value = parts.security || 'tls';
                document.getElementById('vlessTransportType').value = parts.transportType || 'ws';
            } else {
                document.getElementById('vlessUuid').value = '';
                document.getElementById('vlessPath').value = '';
                document.getElementById('vlessSni').value = '';
                document.getElementById('vlessSecurity').value = 'none';
                document.getElementById('vlessTransportType').value = 'ws';
            }
            onProtocolChange();

            // Change add button to edit button temporarily
            const btnAdd = document.getElementById('btnAdd');
            btnAdd.textContent = '保存修改';
            btnAdd.onclick = function () { saveNodeEdit(idx); };

            // Scroll to form
            document.querySelector('.add-form').scrollIntoView({ behavior: 'smooth' });
            showToast('正在编辑: ' + node.名称, 'info');
        }

        // Save node edit
        async function saveNodeEdit(idx) {
            const protocol = document.getElementById('protocol').value;
            const addr = document.getElementById('proxyAddr').value.trim();
            const name = document.getElementById('nodeName').value.trim();

            if (!addr) { showStatus('请输入代理地址', 'error'); return; }

            let fullUrl;
            if (protocol === 'vless') {
                const uuid = document.getElementById('vlessUuid').value.trim();
                const wsPath = document.getElementById('vlessPath').value.trim() || '/';
                const sni = document.getElementById('vlessSni').value.trim() || '';
                const security = document.getElementById('vlessSecurity').value;
                const transportType = document.getElementById('vlessTransportType').value;
                if (!uuid) { showStatus('请输入 UUID', 'error'); return; }
                const parts = addr.split(':');
                const host = parts[0];
                const port = parts[1] || '443';
                fullUrl = 'vless://' + uuid + '@' + host + ':' + port
                    + '?security=' + security + '&type=' + transportType
                    + (transportType === 'ws' ? '&path=' + encodeURIComponent(wsPath) : '&headerType=none')
                    + (sni ? '&sni=' + encodeURIComponent(sni) : '')
                    + (transportType === 'ws' ? '&fp=chrome' : '');
            } else {
                fullUrl = protocol + '://' + addr;
            }
            const oldUrl = config.配置列表[idx].URL;
            const wasSelected = config.配置列表[idx].Selected;

            // Check duplicate (exclude current node)
            if (config.配置列表.some((n, i) => i !== idx && n.URL === fullUrl)) {
                showStatus('该节点已存在', 'error');
                return;
            }

            config.配置列表[idx].名称 = name || buildName(addr, protocol);
            config.配置列表[idx].URL = fullUrl;
            config.配置列表[idx].Selected = wasSelected;

            // Update 当前选中 if this node was selected
            if (wasSelected) {
                config.当前选中 = fullUrl;
            }

            await saveConfig();
            renderNodes();
            showStatus('已更新: ' + config.配置列表[idx].名称, 'success');

            // Reset form
            document.getElementById('proxyAddr').value = '';
            document.getElementById('nodeName').value = '';
            document.getElementById('vlessUuid').value = '';
            document.getElementById('vlessPath').value = '';
            document.getElementById('vlessSni').value = '';
            const btnAdd = document.getElementById('btnAdd');
            btnAdd.textContent = '添加节点';
            btnAdd.onclick = addNode;
            verifiedProtocol = '';
            verifiedAddress = '';
            showToast('节点已更新', 'success');
        }

        // Delete node
        async function deleteNode(idx) {
            const node = config.配置列表[idx];
            if (!node) return;
            if (!confirm('确定删除节点 "' + node.名称 + '"?')) return;

            const wasSelected = node.Selected;
            const isLastNode = config.配置列表.length === 1;
            config.配置列表.splice(idx, 1);

            if (wasSelected && config.配置列表.length > 0) {
                config.当前选中 = config.配置列表[0].URL;
                config.配置列表[0].Selected = true;
            } else if (config.配置列表.length === 0) {
                config.当前选中 = "";
            }

            // 删除最后一个节点时自动关闭启用开关
            if (isLastNode && config.启用) {
                config.启用 = false;
                document.getElementById('enableToggle').checked = false;
            }

            await saveConfig();
            renderNodes();
            showToast('节点已删除', 'info');
        }

        // Save — returns the saved config from server response, or null on failure
        async function saveConfig() {
            config.黑名单 = document.getElementById('blacklist').value.trim();
            // 节点列表为空时，强制关闭启用状态
            if (config.配置列表.length === 0) {
                config.启用 = false;
                document.getElementById('enableToggle').checked = false;
            } else {
                config.启用 = document.getElementById('enableToggle').checked;
            }
            console.log('[DEBUG] saveConfig 发送数据:', JSON.stringify(config, null, 2));
            try {
                const res = await fetch('/admin/landing.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config),
                    credentials: 'same-origin'
                });
                console.log('[DEBUG] saveConfig 响应状态:', res.status);
                console.log('[DEBUG] saveConfig 响应类型:', res.headers.get('content-type'));
                // 检查响应内容类型，非 JSON 说明认证被重定向到了登录页
                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const htmlText = await res.text().catch(() => '<无法读取>');
                    console.error('[DEBUG] 非JSON响应内容:', htmlText.substring(0, 500));
                    throw new Error('认证已过期，请重新登录');
                }
                const data = await res.json();
                console.log('[DEBUG] saveConfig 响应体:', JSON.stringify(data));
                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }
                if (!data.success) {
                    throw new Error(data.error || '保存失败');
                }
                console.log('[DEBUG] saveConfig 保存成功');
                // 用服务端返回的数据更新本地 config，确保与 KV 一致
                if (data.config) {
                    config.启用 = data.config.启用;
                    config.配置列表 = Array.isArray(data.config.配置列表) ? data.config.配置列表 : config.配置列表;
                    config.当前选中 = data.config.当前选中 || config.当前选中;
                    config.黑名单 = data.config.黑名单 || config.黑名单;
                    // 确保所有节点有 Selected 字段
                    config.配置列表.forEach(node => {
                        if (node.Selected === undefined) {
                            node.Selected = (config.当前选中 === node.URL);
                        }
                    });
                }
                return data.config || null;
            } catch (e) {
                console.error('保存失败:', e);
                showToast('保存失败: ' + e.message, 'error');
                return null;
            }
        }

        // Update blacklist only
        async function updateBlacklist() {
            const btn = document.getElementById('btnBlacklist');
            const val = document.getElementById('blacklist').value.trim();
            btn.disabled = true;
            btn.textContent = '保存中...';
            try {
                const res = await fetch('/admin/landing.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 黑名单: val, 启用: config.启用, 配置列表: config.配置列表, 当前选中: config.当前选中 })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                console.log('黑名单保存结果:', data);
                // 用服务端返回的数据更新本地 config
                if (data.config) {
                    config.启用 = data.config.启用;
                    config.配置列表 = Array.isArray(data.config.配置列表) ? data.config.配置列表 : config.配置列表;
                    config.当前选中 = data.config.当前选中 || config.当前选中;
                    config.黑名单 = data.config.黑名单 || config.黑名单;
                    config.配置列表.forEach(node => {
                        if (node.Selected === undefined) {
                            node.Selected = (config.当前选中 === node.URL);
                        }
                    });
                }
                showToast('黑名单已更新', 'success');
            } catch (e) {
                console.error('保存黑名单失败:', e);
                showToast('更新失败: ' + e.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = '更新';
        }

        // Init
        loadConfig();
    </script>
</body>
